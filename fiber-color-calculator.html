<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>ژمێرەری ڕەنگەکانی فایبەر ئۆپتیک</title>

<!-- Web-safe fallback fonts for Arabic-script rendering (Kurdish Sorani + Arabic).
     If a licensed NRT font file (NRT.ttf / NRT.woff2) is available, drop it next to
     this HTML file and uncomment the @font-face block below to use the true NRT face. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;500;600;700;800&family=Cairo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">

<style>
  /* -----------------------------------------------------------
     @font-face NRT — uncomment and point to a local NRT font file
     to use the authentic NRT Kurdish typeface for ku-labeled text.
  --------------------------------------------------------------
  @font-face {
    font-family: 'NRT';
    src: url('NRT.woff2') format('woff2'), url('NRT.ttf') format('truetype');
    font-weight: 400 800;
    font-display: swap;
  }
  ----------------------------------------------------------- */

  :root{
    /* ============ Design tokens — light mode ============
       Palette drawn from OSP/telecom field gear: slate + graphite structure,
       signal-cyan accent (fiber glint), hi-vis amber for warnings/secondary. */
    --bg: #eef1f4;
    --bg-soft: #e4e9ee;
    --surface: #ffffff;
    --surface-2: #f5f7f9;
    --border: #ccd4dc;
    --text: #10161c;
    --text-dim: #4a5561;
    --accent: #0e7c86;
    --accent-strong: #075b63;
    --accent-contrast: #ffffff;
    --amber: #c4720f;
    --danger: #b3261e;
    --shadow: 0 10px 30px -12px rgba(16, 22, 28, 0.18);
    --radius-lg: 20px;
    --radius-md: 14px;
    --radius-sm: 10px;
    --mono: 'JetBrains Mono', 'Share Tech Mono', monospace;
    --font-ku: 'NRT', 'Rabar_021', 'Noto Naskh Arabic', 'Noto Kufi Arabic', sans-serif;
    --font-ar: 'Cairo', 'Noto Kufi Arabic', 'Noto Naskh Arabic', sans-serif;
  }

  html[data-theme="dark"]{
    /* ============ Design tokens — dark mode ============ */
    --bg: #0a1116;
    --bg-soft: #0f1922;
    --surface: #131e27;
    --surface-2: #182632;
    --border: #263542;
    --text: #f2f6f9;
    --text-dim: #a9b8c4;
    --accent: #37c6d1;
    --accent-strong: #62dbe5;
    --accent-contrast: #052225;
    --amber: #f0a63e;
    --danger: #ff6b62;
    --shadow: 0 10px 34px -10px rgba(0, 0, 0, 0.55);
  }

  *{ box-sizing: border-box; }

  html, body{
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
  }

  body{
    font-family: var(--font-ku);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    transition: background .25s ease, color .25s ease;
    background-image:
      radial-gradient(circle at 100% -10%, color-mix(in srgb, var(--accent) 10%, transparent), transparent 45%),
      radial-gradient(circle at -10% 110%, color-mix(in srgb, var(--amber) 8%, transparent), transparent 40%);
    background-attachment: fixed;
  }

  body[data-lang="ar"]{ font-family: var(--font-ar); }

  button, input{ font-family: inherit; }

  /* ---------- Layout shell ---------- */
  .app{
    max-width: 640px;
    margin: 0 auto;
    padding: 10px 14px 12px;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  /* ---------- Top bar ---------- */
  .topbar{
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    text-align: center;
  }

  .brand-center{
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1px;
  }

  .brand-mark{
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .brand-dot{
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: conic-gradient(from 180deg,
      #2255CC 0 8.3%, #FF7A1A 8.3% 16.6%, #1F9D55 16.6% 25%,
      #7A4B26 25% 33.3%, #8A8F98 33.3% 41.6%, #F5F5F5 41.6% 50%,
      #E53935 50% 58.3%, #1A1A1A 58.3% 66.6%, #F5C518 66.6% 75%,
      #7B3FA0 75% 83.3%, #F06292 83.3% 91.6%, #26C6DA 91.6% 100%);
    box-shadow: 0 0 0 2px var(--surface), 0 0 0 3px var(--border);
    flex-shrink: 0;
  }

  h1{
    font-size: 14.5px;
    line-height: 1.3;
    margin: 0;
    font-weight: 800;
    letter-spacing: .1px;
  }

  .subtitle{
    font-size: 10.5px;
    color: var(--text-dim);
    margin: 0;
  }

  .icon-btn-row{
    display: flex;
    gap: 8px;
    flex-shrink: 0;
  }

  .icon-btn{
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    border-radius: var(--radius-sm);
    padding: 7px 12px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    transition: transform .15s ease, background .2s ease, border-color .2s ease;
    white-space: nowrap;
  }
  .icon-btn:hover{ border-color: var(--accent); color: var(--accent-strong); }
  .icon-btn:active{ transform: scale(.96); }
  .icon-btn:focus-visible, button:focus-visible, input:focus-visible{
    outline: 3px solid var(--accent);
    outline-offset: 2px;
  }

  /* ---------- Search ---------- */
  .search-wrap{
    position: relative;
  }

  .search-input{
    width: 100%;
    padding: 11px 52px 11px 16px;
    font-size: 18px;
    font-weight: 700;
    font-family: var(--mono);
    letter-spacing: 1px;
    border-radius: var(--radius-md);
    border: 1.5px solid var(--border);
    background: var(--surface);
    color: var(--text);
    transition: border-color .2s ease, box-shadow .2s ease;
  }
  .search-input::placeholder{
    font-family: inherit;
    font-weight: 600;
    font-size: 15px;
    letter-spacing: normal;
    color: var(--text-dim);
    font-family: var(--font-ku);
  }
  body[data-lang="ar"] .search-input::placeholder{ font-family: var(--font-ar); }
  .search-input:focus{
    border-color: var(--accent);
    box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 22%, transparent);
    outline: none;
  }

  .search-range{
    position: absolute;
    inset-inline-end: 14px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 11px;
    color: var(--text-dim);
    font-family: var(--mono);
    pointer-events: none;
    background: var(--surface);
  }

  .error-msg{
    color: var(--danger);
    font-size: 13px;
    font-weight: 700;
    margin-top: 8px;
    display: none;
  }
  .error-msg.show{ display: block; }

  /* ---------- Readout panel (signature element) ---------- */
  .readout{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  .readout-grid{
    display: grid;
    grid-template-columns: 1fr 1fr;
  }

  @media (max-width: 480px){
    .readout-grid{ grid-template-columns: 1fr; }
    .readout-grid > div:first-child{ border-bottom: 1px dashed var(--border); }
    .readout-grid > div:not(:first-child){ border-inline-start: none !important; }
  }

  .readout-cell{
    padding: 16px 14px 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 8px;
  }
  .readout-grid > div:last-child{
    border-inline-start: 1px dashed var(--border);
  }

  .cell-kicker{
    font-family: var(--font-ku);
    font-size: 13.5px;
    font-weight: 700;
    letter-spacing: .3px;
    color: var(--text-dim);
  }
  body[data-lang="ar"] .cell-kicker{ font-family: var(--font-ar); }

  /* Fiber cross-section styled swatch */
  .swatch{
    width: 58px;
    height: 58px;
    border-radius: 50%;
    position: relative;
    box-shadow:
      inset 0 -8px 14px rgba(0,0,0,.25),
      inset 0 6px 10px rgba(255,255,255,.25),
      0 6px 18px -6px rgba(0,0,0,.35);
    border: 2px solid rgba(0,0,0,.15);
  }
  .swatch.is-light-fill{ border: 2px solid var(--border); }
  .swatch::after{
    /* fiber core glint */
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: radial-gradient(circle at 32% 28%, rgba(255,255,255,.55), transparent 45%);
  }
  .swatch.striped::before{
    content: "";
    position: absolute;
    left: -2px; right: -2px;
    top: 50%;
    height: 6px;
    margin-top: -3px;
    background: #111111;
    box-shadow: 0 0 0 1.5px rgba(255,255,255,.55);
    z-index: 2;
    border-radius: 3px;
  }

  .cell-name{
    font-family: var(--font-ku);
    font-size: 22px;
    font-weight: 800;
    line-height: 1.35;
  }
  body[data-lang="ar"] .cell-name{ font-family: var(--font-ar); }

  .cell-sub{
    font-family: var(--font-ku);
    font-size: 13.5px;
    color: var(--text-dim);
    font-weight: 600;
  }
  body[data-lang="ar"] .cell-sub{ font-family: var(--font-ar); }

  .cell-badge{
    font-family: var(--font-ku);
    margin-top: 2px;
    font-size: 13.5px;
    font-weight: 700;
    padding: 6px 14px;
    border-radius: 999px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text-dim);
  }
  body[data-lang="ar"] .cell-badge{ font-family: var(--font-ar); }

  .cell-badge.simple{ color: var(--accent-strong); border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); }
  .cell-badge.striped{ color: var(--amber); border-color: color-mix(in srgb, var(--amber) 45%, var(--border)); }

  /* ---------- Quick nav ---------- */
  .quicknav{
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  .nav-btn{
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: var(--radius-sm);
    padding: 10px 6px;
    font-family: var(--mono);
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: transform .12s ease, background .2s ease, border-color .2s ease;
  }
  .nav-btn:hover{ border-color: var(--accent); color: var(--accent-strong); }
  .nav-btn:active{ transform: translateY(2px) scale(.98); background: var(--surface-2); }

  /* ---------- Colors toggle + list ---------- */
  .colors-toggle{
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: var(--radius-md);
    padding: 11px 16px;
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: border-color .2s ease;
  }
  .colors-toggle:hover{ border-color: var(--accent); }
  .caret{
    width: 10px; height: 10px;
    border-inline-end: 2.5px solid var(--text-dim);
    border-bottom: 2.5px solid var(--text-dim);
    transform: rotate(45deg);
    transition: transform .2s ease;
  }
  .colors-toggle[aria-expanded="true"] .caret{ transform: rotate(-135deg); }

  .colors-panel{
    display: none;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 10px;
    box-shadow: var(--shadow);
  }
  .colors-panel.open{
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: repeat(6, auto);
    grid-auto-flow: column;
    column-gap: 12px;
  }

  .color-row{
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 4px;
    border-radius: 0;
    min-width: 0;
  }
  /* Divider between the two columns (first column sits on the right in RTL) */
  .colors-panel.open .color-row:nth-child(-n+6){
    border-inline-end: 1px solid var(--bg-soft);
    padding-inline-end: 12px;
  }

  .color-idx{
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    width: 16px;
    text-align: center;
    flex-shrink: 0;
  }

  .color-dot{
    width: 22px;
    height: 22px;
    border-radius: 50%;
    flex-shrink: 0;
    border: 1.5px solid rgba(0,0,0,.15);
    box-shadow: inset 0 -3px 6px rgba(0,0,0,.2), inset 0 2px 4px rgba(255,255,255,.25);
  }
  .color-dot.is-light-fill{ border-color: var(--border); }

  .color-name{
    font-family: var(--font-ku);
    font-size: 14.5px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  body[data-lang="ar"] .color-name{ font-family: var(--font-ar); }

  /* ---------- Footer ---------- */
  footer{
    margin-top: auto;
    text-align: center;
    padding-top: 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }

  .footer-credit{
    font-size: 11.5px;
    color: var(--text-dim);
    font-weight: 600;
    margin: 0;
    line-height: 1.5;
  }

  .contact-link{
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 700;
    color: var(--accent-strong);
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 6px 16px;
    text-decoration: none;
    direction: ltr;
    transition: border-color .2s ease, transform .12s ease;
  }
  .contact-link:hover{ border-color: var(--accent); }
  .contact-link:active{ transform: scale(.97); }
  .contact-label{
    font-family: var(--font-ku);
    font-weight: 700;
  }
  body[data-lang="ar"] .contact-label{ font-family: var(--font-ar); }

  /* Reduced motion */
  @media (prefers-reduced-motion: reduce){
    *{ transition: none !important; }
  }

  .sr-only{
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0,0,0,0);
    white-space: nowrap;
    border: 0;
  }
</style>
</head>

    tubeName: document.getElementById("tubeName"),
    tubeTypeBadge: document.getElementById("tubeTypeBadge"),
    quicknavBtns: document.querySelectorAll(".nav-btn"),
    colorsToggle: document.getElementById("colorsToggle"),
    colorsToggleLabel: document.getElementById("colorsToggleLabel"),
    colorsPanel: document.getElementById("colorsPanel"),
    footerText: document.getElementById("footerText"),
    contactLabel: document.getElementById("contactLabel")
  };

  /* =========================================================
     Core math: given a core number (1-288) derive color + tube info.
  ========================================================= */
  function computeFiberInfo(core){
    var coreColorIndex = (core - 1) % 12;               // 0-11
    var tubeNumber = Math.ceil(core / 12);               // 1-24
    var tubeColorIndex = (tubeNumber - 1) % 12;           // 0-11
    var isStriped = core > 144;                           // 145-288 -> striped tubes
    return {
      coreColorIndex: coreColorIndex,
      tubeNumber: tubeNumber,
      tubeColorIndex: tubeColorIndex,
      isStriped: isStriped
    };
  }

  /* =========================================================
     Rendering
  ========================================================= */
  function applySwatch(node, colorIndex, striped){
    var c = COLORS[colorIndex];
    node.style.background = c.hex;
    node.classList.toggle("striped", !!striped);
    node.classList.toggle("is-light-fill", LIGHT_FILL_INDEXES.indexOf(colorIndex) !== -1);
  }

  function colorName(colorIndex){
    return COLORS[colorIndex][state.lang];
  }

  function renderStaticText(){
    var t = STR[state.lang];
    el.pageTitle.textContent = t.pageTitle;
    document.title = t.pageTitle;
    el.pageSubtitle.textContent = t.pageSubtitle;
    el.searchInput.placeholder = t.searchPlaceholder;
    el.coreKicker.textContent = t.coreKicker;
    el.tubeKicker.textContent = t.tubeKicker;
    el.colorsToggleLabel.textContent = t.colorsToggleLabel;
    el.langToggle.textContent = t.langButton;
    el.themeToggle.textContent = (state.theme === "light") ? t.themeToDark : t.themeToLight;
    el.errorMsg.textContent = t.invalidRange;
    el.footerText.textContent = t.footerText;
    el.contactLabel.textContent = t.contactLabel;
  }

  function renderResult(){
    var t = STR[state.lang];
    var info = computeFiberInfo(state.core);

    applySwatch(el.coreSwatch, info.coreColorIndex, false);
    el.coreName.textContent = t.corePrefix + " " + colorName(info.coreColorIndex);

    applySwatch(el.tubeSwatch, info.tubeColorIndex, info.isStriped);
    el.tubeName.textContent = t.tubePrefix + " " + colorName(info.tubeColorIndex);

    el.tubeTypeBadge.textContent = info.isStriped ? t.stripedTube : t.simpleTube;
    el.tubeTypeBadge.className = "cell-badge " + (info.isStriped ? "striped" : "simple");
  }

  function renderColorsPanel(){
    var frag = document.createDocumentFragment();
    COLORS.forEach(function(c, i){
      var row = document.createElement("div");
      row.className = "color-row";

      var idx = document.createElement("span");
      idx.className = "color-idx";
      idx.textContent = (i + 1);

      var dot = document.createElement("span");
      dot.className = "color-dot" + (LIGHT_FILL_INDEXES.indexOf(i) !== -1 ? " is-light-fill" : "");
      dot.style.background = c.hex;

      var name = document.createElement("span");
      name.className = "color-name";
      name.textContent = c[state.lang];

      row.appendChild(idx);
      row.appendChild(dot);
      row.appendChild(name);
      frag.appendChild(row);
    });
    el.colorsPanel.innerHTML = "";
    el.colorsPanel.appendChild(frag);
  }

  function renderAll(){
    renderStaticText();
    renderResult();
    renderColorsPanel();
  }

  /* =========================================================
     Input handling — live search, clamped to 1-288
  ========================================================= */
  function setCore(newCore, opts){
    opts = opts || {};
    var n = parseInt(newCore, 10);

    if (isNaN(n)){
      if (opts.fromInput) toggleError(el.searchInput.value.trim() !== "");
      return;
    }

    var clamped = Math.min(288, Math.max(1, n));
    state.core = clamped;

    // Reflect the clamped value back into the search box only when it
    // was changed via quick-nav buttons, so live typing isn't fought.
    if (!opts.fromInput){
      el.searchInput.value = clamped;
    }

    toggleError(false);
    renderResult();
  }

  function toggleError(show){
    el.errorMsg.classList.toggle("show", !!show);
  }

  el.searchInput.addEventListener("input", function(){
    var raw = el.searchInput.value.trim();
    if (raw === ""){
      toggleError(false);
      return;
    }
    var n = parseInt(raw, 10);
    if (isNaN(n) || n < 1 || n > 288){
      toggleError(true);
      return;
    }
    toggleError(false);
    state.core = n;
    renderResult();
  });

  el.quicknavBtns.forEach(function(btn){
    btn.addEventListener("click", function(){
      var step = parseInt(btn.getAttribute("data-step"), 10);
      setCore(state.core + step);
    });
  });

  /* =========================================================
     Colors panel toggle
  ========================================================= */
  el.colorsToggle.addEventListener("click", function(){
    var isOpen = el.colorsPanel.classList.toggle("open");
    el.colorsToggle.setAttribute("aria-expanded", isOpen ? "true" : "false");
  });

  /* =========================================================
     Theme toggle
  ========================================================= */
  function applyTheme(){
    el.html.setAttribute("data-theme", state.theme);
    el.themeToggle.setAttribute("aria-pressed", state.theme === "dark" ? "true" : "false");
    el.themeToggle.textContent = (state.theme === "light") ? STR[state.lang].themeToDark : STR[state.lang].themeToLight;
  }

  el.themeToggle.addEventListener("click", function(){
    state.theme = (state.theme === "light") ? "dark" : "light";
    applyTheme();
  });

  /* =========================================================
     Language toggle
  ========================================================= */
  function applyLanguage(){
    el.body.setAttribute("data-lang", state.lang);
    el.html.setAttribute("lang", state.lang);
    // Both Kurdish (Sorani) and Arabic are written right-to-left.
    el.html.setAttribute("dir", "rtl");
    renderAll();
  }

  el.langToggle.addEventListener("click", function(){
    state.lang = (state.lang === "ku") ? "ar" : "ku";
    applyLanguage();
  });

  /* =========================================================
     Init
  ========================================================= */
  el.searchInput.value = state.core;
  applyTheme();
  applyLanguage(); // also triggers renderAll()

})();
</script>
</body>
</html>
